name: Release

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    outputs:
      released: ${{ steps.semantic-release.outputs.released }}
      tag: ${{ steps.semantic-release.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test pre-push hook
        run: bash tests/test_check_main_current.sh

      - name: Python Semantic Release
        id: semantic-release
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.3.0

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/xalexo/firefoxreaderwebservice
          tags: |
            type=raw,value=${{ needs.release.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  Deploy:
    runs-on: [self-hosted, Linux, X64, firefox-reader-deploy]
    environment: dokploy-cutover
    needs: [release, publish]
    if: ${{ needs.release.outputs.released == 'true' }}
    concurrency:
      group: dokploy-firefox-reader
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Redeploy Dokploy Compose application
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail
          test -n "$DOKPLOY_API_KEY"
          test -n "$DOKPLOY_COMPOSE_ID"
          body="$(jq -cn --arg composeId "$DOKPLOY_COMPOSE_ID" '{composeId:$composeId}')"
          status="$(
            {
            printf 'url = "https://dokploy.wcobs.com/api/compose.redeploy"\n'
            printf 'header = "x-api-key: %s"\n' "$DOKPLOY_API_KEY"
            printf 'fail\nsilent\nshow-error\n'
            } | curl --config - --header 'Content-Type: application/json' \
                --data-binary "$body" --max-time 60 --output /dev/null \
                --write-out '%{http_code}'
          )"
          printf 'HTTP %s\n' "$status"
          test "$status" = '200'
