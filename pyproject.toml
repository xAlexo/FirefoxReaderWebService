[project]
name = "reader-web-service"
version = "0.7.6"
description = ""
authors = [{ name = "Alexo", email = "alexo@live.ru" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "loguru>=0.7.2,<0.8.0",
    "selenium>=4.22.0,<5.0.0",
    "pyvirtualdisplay>=3.0,<4.0",
    "selenium-screenshot>=2.1.0,<3.0.0",
    "fastapi>=0.111.0,<0.112.0",
    "uvicorn>=0.30.1,<0.31.0",
    "pyroscope-io>=0.8.7,<0.9.0",
    "notifiers>=1.3.3,<2.0.0",
    "sentry-sdk>=2.19.2,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reader_web_service"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["BLE001"]  # blind except — intentional for sentry capture
